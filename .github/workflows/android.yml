name: Android build

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  debug-apk:
    if: github.event.head_commit.message != 'Add emulator proof screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reborn-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish debug APK to builds branch
        run: |
          git config user.name "Reborn CI"
          git config user.email "reborn-ci@users.noreply.github.com"
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/reborn-debug.apk
          if git fetch origin builds:builds 2>/dev/null; then git checkout builds; else git checkout --orphan builds; git rm -rf . >/dev/null 2>&1 || true; fi
          mkdir -p apk
          cp /tmp/reborn-debug.apk apk/reborn-apk-debug.apk
          git add apk/reborn-apk-debug.apk
          git commit -m "Debug APK from ${{ github.sha }}" || exit 0
          git push -f origin builds

  emulator-proof:
    if: github.event.head_commit.message != 'Add emulator proof screenshots'
    runs-on: ubuntu-latest
    # Healthy proof runs take ~12 min; wedged API-30 emulators otherwise hang
    # to the 360 min default (proven: three wedged runs on 2026-09-23).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # The API-30 image is chronically unstable (three wedged/crashed
          # runs on 2026-09-23: system_server dying mid-install, frozen
          # display, stalled boot). API 33 is materially more stable.
          api-level: 33
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            chmod +x tools/emulator-proof.sh
            ./tools/emulator-proof.sh
      - name: Validate PNG signatures
        run: |
          for f in screenshots/*.png; do test "$(head -c 8 "$f" | xxd -p)" = "89504e470d0a1a0a"; done
      - uses: actions/upload-artifact@v4
        with:
          name: reborn-apk-emulator-proof
          path: screenshots/
      - name: Publish proof screenshots to repository
        run: |
          git config user.name "Reborn CI"
          git config user.email "reborn-ci@users.noreply.github.com"
          git add screenshots/*.png screenshots/proof-log.txt
          git commit -m "Add emulator proof screenshots" || exit 0
          # CI setup writes local.properties etc. - an unstaged tree makes the
          # rebase refuse to run. Everything we publish is already committed.
          git reset --hard HEAD
          # Push this exact HEAD to main with an explicit refspec (works from a
          # branch or a detached checkout). Rebase+retry on a non-fast-forward.
          git fetch origin main
          git rebase -X theirs origin/main || { git rebase --abort; exit 0; }
          git push origin HEAD:main || { git pull --rebase -X theirs origin main && git push origin HEAD:main; }
      - name: Verify screenshots exist
        run: test -s screenshots/01-idle-keypad.png -a -s screenshots/05-sms-inbox.png -a -s screenshots/08-incoming-call.png -a -s screenshots/09-calllog.png
